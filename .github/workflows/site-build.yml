name: Site build

on:
  pull_request:
    paths: ['site/**']
  push:
    branches: [main]
    paths: ['site/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:offline
        working-directory: site
